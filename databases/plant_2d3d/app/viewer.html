<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlantView｜2D → 3D 植物表型資料</title>
<style>
:root{--ink:#183b2b;--muted:#60746a;--green:#286448;--line:#dce6de;--paper:#f4f7f2;--amber:#8e5a15}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,"Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{background:#183b2b;color:white;padding:38px max(24px,calc((100vw - 1220px)/2)) 32px}.brand{font-size:13px;letter-spacing:3px;opacity:.7}h1{font-size:32px;line-height:1.3;margin:12px 0 8px;font-weight:650}header p{margin:0;color:#d3e3d4}main{max-width:1268px;padding:28px 24px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}.stat strong{font-size:31px;display:block;line-height:1.25}.stat span{font-size:13px;color:var(--muted)}.notice{padding:15px 18px;border-radius:10px;background:#fff5df;color:#77501e;font-size:14px;margin:22px 0}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:25px 0 18px}.tools label{display:flex;align-items:center;gap:7px}.tools input[type=date],select{padding:8px 12px;border:1px solid #cbd8ce;border-radius:7px;background:white;color:var(--ink)}.subtle{color:var(--muted);font-size:13px}#count{margin-left:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;color:inherit;padding:0;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 9px 25px #183b2b15}.photo{height:205px;background:#101b14;display:flex;align-items:center;justify-content:center;color:#9db0a3}.photo img{width:100%;height:100%;object-fit:contain}.body{padding:18px}.date{font-size:17px;font-weight:650}.pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:5px;background:#e9f0e8;color:#466146;margin:9px 5px 9px 0}.pill.warn{color:var(--amber);background:#fff0d8}.metrics{display:flex;gap:24px;border-top:1px solid var(--line);padding-top:12px;margin-top:7px}.metrics strong{display:block;font-size:19px}.metrics span{font-size:12px;color:var(--muted)}.empty{grid-column:1/-1;padding:55px;text-align:center;color:var(--muted);border:1px dashed #b9c9be;border-radius:14px}footer{font-size:12px;color:var(--muted);padding:35px 0 10px}.error{background:#ffe8e3;color:#8d3021;padding:15px;border-radius:10px}dialog{border:0;border-radius:17px;max-width:1120px;width:94vw;padding:0;color:var(--ink);box-shadow:0 25px 100px #0004}dialog::backdrop{background:#102519aa}.modal-head{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;align-items:start;gap:20px}.modal-head h2{margin:0;font-size:23px}.close{margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;padding:4px 12px}.modal-body{padding:22px 28px}.btn{display:inline-block;background:var(--green);color:white;text-decoration:none;border:0;border-radius:7px;padding:9px 15px}.metric-table{width:100%;border-collapse:collapse;margin:16px 0 25px}.metric-table td,.metric-table th{padding:9px;border-bottom:1px solid var(--line);text-align:left}.metric-table th{font-size:12px;color:var(--muted)}.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.thumbs figure{margin:0}.thumbs img{height:160px;width:100%;object-fit:contain;background:#0b130e;border-radius:7px}.thumbs figcaption{font-size:12px;color:var(--muted)}.section-head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#loadmore{margin:20px 0;background:white;color:var(--green);border:1px solid var(--line)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){h1{font-size:26px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}.modal-head,.modal-body{padding:18px}.stat{padding:15px}#count{width:100%;margin:0}.metric-table{font-size:12px}}
</style><style>.stats{grid-template-columns:repeat(5,minmax(0,1fr))}@media(max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body>
<header><div class="brand">PLANTVIEW / PHENOTYPE DATA</div><h1>一株植物，多個角度，一份數值。</h1><p>2D 多視角影像與 3D 表型資料的唯讀預覽</p></header>
<main><section class="stats"><div class="stat"><strong id="nobs">—</strong><span>PLY 區塊候選</span></div><div class="stat"><strong id="ntime">—</strong><span>時間候選已連結（場）</span></div><div class="stat"><strong id="nlinked">—</strong><span>人工確認單株（組）</span></div><div class="stat"><strong id="nviews">—</strong><span>單株原始圖片視角</span></div><div class="stat"><strong id="nready">—</strong><span>具可試訓數值（組）</span></div></section>
<div class="notice"><b>CAM1～4拍攝同一株，旋轉角度不另加算。</b>人工確認的單株原圖已連接CSV，不需SAM裁切。原廠表型與PLY幾何代理值分開保存；數值有問題的來源保留連結及備註。其他多株仍列在時間候選，未套用順序假設。</div>
<div class="tools"><select id="scope" aria-label="檢視範圍"><option value="confirmed" selected>人工確認單株</option><option value="time">時間候選場次</option><option value="single">舊版場景連結</option></select><label id="linked-control"><input id="linked" type="checkbox" checked>只看已有圖片連結</label><select id="crop" aria-label="作物"><option value="">全部作物</option><option value="lettuce">萵苣</option><option value="tomato">番茄</option></select><input id="date" type="date" aria-label="拍攝日期"><button id="clear" class="close">清除日期</button><span id="count" class="subtle">讀取資料中…</span></div>
<div id="errors"></div><section id="cards" class="grid"></section><footer id="foot">資料與圖片由遠端主機提供。多個角度共用同一份選定 CSV，不代表不同植株。此頁僅提供檢視與下載。</footer></main>
<dialog id="detail"><div class="modal-head"><div><h2 id="detail-title"></h2><div id="detail-sub" class="subtle"></div></div><button class="close" id="close">關閉 ×</button></div><div class="modal-body" id="detail-body"></div></dialog>
<script>
const base=location.pathname.endsWith('/')?location.pathname:location.pathname+'/';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v===null||v===undefined?'—':Number(v).toLocaleString('zh-TW',{maximumFractionDigits:2});
const cropName=c=>c==='lettuce'?'萵苣':c==='tomato'?'番茄':'作物待確認';
const status=s=>s.startsWith('HOLD')?'配對擱置':s==='USER_SINGLE_POT_DIRECT'?'單盆原圖直接連結':s==='ORDER_ASSUMED_UNVERIFIED'?'依序假設配對・未驗證':s==='LINKED_SCENE_SCREENED_EXACT'?'單株場景已連結・時間一致':s==='LINKED_SCENE_APPROXIMATE_TIME'?'近時間連結候選・暫不訓練':s==='SINGLE_PLANT_OBSERVED_IN_CORRECTED_SELECTION'?'單株修正版候選':'尚待審查';
async function api(path){const response=await fetch(base+'api/'+path);if(!response.ok)throw Error('資料暫時無法讀取，請稍後重試。');return response.json();}
async function overview(){const [v,rows]=await Promise.all([api('overview'),api('observations?linked=1')]);$('nobs').textContent=num(v.observations);$('nlinked').textContent=num(v.linked_observations);$('nviews').textContent=num(v.linked_views);$('nready').textContent=num(rows.filter(r=>r.visual_review_status==='LINKED_SCENE_SCREENED_EXACT').length);$('foot').textContent=`自動處理 ${num(v.processed_images)} 張來源影像；${num(v.no_detection_images)} 張未檢出，仍待品質檢查。資料由遠端主機提供，多個視角不是不同植株樣本。`;}
async function load(){try{$('errors').textContent='';$('count').textContent='讀取中…';const q=new URLSearchParams({linked:$('linked').checked?'1':'0',crop:$('crop').value,date:$('date').value});const rows=await api('observations?'+q);$('count').textContent=`顯示 ${rows.length} 個觀測`;$('cards').innerHTML=rows.length?rows.map(r=>`<button class="card" data-id="${r.observation_id}"><div class="photo">${r.thumbnail_asset_id?`<img loading="lazy" src="${base}asset/${r.thumbnail_asset_id}" alt="${esc(r.captured_at)} 單株裁切候選">`:'尚無單株圖片連結'}</div><div class="body"><div class="date">${esc(r.captured_at)}</div><span class="pill">${cropName(r.crop)}</span><span class="pill warn">${status(r.visual_review_status)}</span><div class="subtle">${esc(r.physical_plant_id_candidate||r.scene_local_plant_id||'實體盆號待確認')}</div><div class="subtle">${num(r.linked_image_count)} 個圖片視角 · 唯一選定 CSV</div><div class="metrics"><div><strong>${num(r.pGH_proxy)}</strong><span>株高代理值</span></div><div><strong>${num(r.pMW_proxy)}</strong><span>冠幅代理值</span></div></div><div class="subtle">${r.coordinate_unit==='UNVERIFIED'?'座標單位尚未驗證':esc(r.coordinate_unit)}</div></div></button>`).join(''):'<div class="empty">目前篩選條件沒有資料。可清除日期或取消「只看已有圖片連結」。</div>';document.querySelectorAll('.card').forEach(card=>card.onclick=()=>detail(card.dataset.id));}catch(error){$('errors').innerHTML=`<div class="error">${esc(error.message)}</div>`;$('count').textContent='';}}
const labels={pGH_proxy:'株高代理值',pMW_proxy:'冠幅代理值',xy_convex_hull_area:'XY 凸包面積',centroid_x:'中心 X',centroid_y:'中心 Y',centroid_z:'中心 Z',extent_x:'X 範圍',extent_y:'Y 範圍',extent_z:'Z 範圍',normal_tilt_mean_deg:'點法向平均傾角（非原廠葉角）',pTLA:'原廠總葉面積 pTLA',pPLA:'原廠投影面積 pPLA',pLAA:'原廠平均葉角 pLAA',pCHA:'原廠凸包指標 pCHA',pE:'原廠偏心率 pE'};
let detailData=null,shown=0;
function gallery(){const selector=$('mode');const hasMasks=detailData.images.some(v=>v.mask_asset_id);const hasSegmented=detailData.images.some(v=>v.segmented_asset_id);selector.options[0].text=detailData.images.some(v=>v.image_kind==='RAW')?'原始單盆 RGB':'RGB 裁切';selector.options[1].disabled=!hasSegmented;selector.options[2].disabled=!hasMasks;if((selector.value==='mask'&&!hasMasks)||(selector.value==='segmented'&&!hasSegmented))selector.value='rgb';const mode=selector.value;const images=detailData.images.slice(0,shown);$('gallery').innerHTML=images.map(v=>{const id=mode==='mask'&&v.mask_asset_id?v.mask_asset_id:mode==='segmented'&&v.segmented_asset_id?v.segmented_asset_id:v.asset_id;return `<figure><a href="${base}asset/${id}" target="_blank" rel="noopener"><img loading="lazy" src="${base}asset/${id}" alt="CAM${esc(v.camera_code)} 第${v.frame_index}視角"></a><figcaption>CAM${esc(v.camera_code)} · 第 ${v.frame_index} 視角 · ${v.image_kind==='RAW'?'原始單盆影像':'裁切候選'}</figcaption></figure>`}).join('');$('loadmore').hidden=shown>=detailData.images.length;}
async function detail(id){try{const v=await api('observations/'+id);detailData=v;shown=Math.min(16,v.images.length);$('detail-title').textContent=v.captured_at+' · '+cropName(v.crop);$('detail-sub').textContent=v.physical_plant_id_candidate||v.scene_local_plant_id||'實體盆號待確認';$('detail-body').innerHTML=`<div class="notice"><b>${status(v.visual_review_status)}</b> · ${v.export_kind==='CORRECTION_SELECTION'?'選用較乾淨的修正版點雲數值':'原始區塊候選，單盆範圍尚待確認'}。${v.coordinate_unit==='UNVERIFIED'?' 座標單位尚未驗證。':''}缺少的原廠表型保留空值，沒有用多盆平均值補入。</div><a class="btn" href="${base}api/observations/${v.observation_id}/csv">下載此觀測的 CSV 數值</a><table class="metric-table"><thead><tr><th>指標</th><th>值</th><th>單位／狀態</th></tr></thead><tbody>${v.metrics.map(m=>`<tr><td>${esc(labels[m.metric_code]||m.metric_code)}<br><span class="subtle">${esc(m.metric_code)}</span></td><td>${num(m.metric_value)}</td><td>${m.metric_value===null?'未提供':m.unit==='UNVERIFIED'?'單位待驗證':esc(m.unit)}</td></tr>`).join('')}</tbody></table><div class="section-head"><h3>同一場次的圖片視角（${v.images.length}）</h3><select id="mode" aria-label="圖片類型"><option value="rgb">RGB 裁切</option><option value="segmented">去背圖</option><option value="mask">遮罩</option></select></div><div id="gallery" class="thumbs"></div><button id="loadmore" class="btn">顯示更多視角</button><p class="subtle">這些視角的數值答案共用同一個觀測的 CSV。圖片遮罩尚非人工標註真值。</p>`;$('mode').onchange=gallery;$('loadmore').onclick=()=>{shown+=24;gallery()};gallery();$('detail').showModal();}catch(error){$('errors').innerHTML=`<div class="error">${esc(error.message)}</div>`;}}
$('close').onclick=()=>$('detail').close();$('detail').addEventListener('click',e=>{if(e.target===$('detail'))$('detail').close()});
</script><script src="time-candidates.js"></script><script src="user-samples.js"></script></body></html>
